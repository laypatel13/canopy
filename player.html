<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>canopy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz@0,6..72;1,6..72&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0e0e0d;
  --panel: #151513;
  --line: #262522;
  --ink: #ece7de;
  --muted: #8f8a80;
  --dim: #55534e;
  --green: #4fd08b;
  --amber: #f2a65a;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--ink); }
body {
  font: 14px/1.5 'Geist Mono', ui-monospace, monospace;
  min-height: 100vh;
  padding: 48px 56px 40px;
  display: flex;
  flex-direction: column;
  gap: 32px;
}
header h1 { font: 400 64px/1 Newsreader, Georgia, serif; letter-spacing: -0.01em; }
header p { font: 400 24px/1.35 Newsreader, Georgia, serif; color: var(--muted); margin-top: 14px; max-width: 56ch; }
main {
  display: grid;
  grid-template-columns: minmax(340px, 460px) minmax(0, 1fr);
  gap: 48px;
  flex: 1;
}
.side { display: flex; flex-direction: column; gap: 22px; min-width: 0; }
h2 { font: 500 11px/1 'Geist Mono', monospace; color: var(--muted); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 10px; }

.code {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 0;
  font-size: 13px;
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--dim) transparent;
}
.ln { display: grid; grid-template-columns: 40px max-content; white-space: pre; border-left: 3px solid transparent; transition: background-color .2s, border-color .2s; }
.ln .n { color: var(--dim); text-align: right; padding-right: 16px; user-select: none; }
.ln.on { background: rgba(242, 166, 90, 0.10); border-left-color: var(--amber); }
.ln.on .n { color: var(--amber); }
.ln.doc { opacity: 0.45; }
.k { color: var(--muted); }
.id { color: var(--green); }
.me { color: var(--amber); }
.s { color: var(--muted); }
.c { color: var(--dim); font-style: italic; }

.controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
button {
  font: 500 13px 'Geist Mono', monospace;
  color: var(--ink);
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 8px;
  height: 36px;
  padding: 0 14px;
  cursor: pointer;
  transition: border-color .15s, transform .1s, background-color .15s;
}
button:hover { border-color: var(--muted); }
button:active { transform: translateY(1px); }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
button.play { background: var(--ink); color: var(--bg); border-color: var(--ink); min-width: 84px; }
.count { margin-left: auto; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--amber); }
.say { min-height: 1.5em; color: var(--ink); font-size: 14px; }
.say b { color: var(--green); font-weight: 500; }
.say i { color: var(--amber); font-style: normal; }

.frames { list-style: none; display: flex; flex-direction: column; gap: 6px; }
.frame { border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 8px; padding: 8px 12px; color: var(--muted); font-size: 12.5px; }
.frame .sig { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.frame .vars { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 2px; }
.frame.top { border-left-color: var(--amber); color: var(--ink); background: var(--panel); }
.frame.top .sig { color: var(--amber); }
.var.new { color: var(--green); }

.stage { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 560px; }
.stage svg { width: 100%; flex: 1; min-height: 520px; display: block; overflow: visible; }
.edge { fill: none; stroke: var(--muted); stroke-linecap: round; opacity: 0; transition: opacity .3s, stroke .25s; }
.edge.shown { opacity: 0.45; }
.edge.live { stroke: var(--ink); opacity: 1; }
.trunk { stroke: var(--ink); }
.call { opacity: 0; transition: opacity .3s; }
.call.shown { opacity: 1; }
.call circle { fill: var(--bg); stroke: var(--muted); stroke-width: 1.5; transition: fill .25s, stroke .25s; }
.call .v { fill: var(--muted); font: 500 12px 'Geist Mono', monospace; text-anchor: middle; dominant-baseline: central; transition: fill .25s; }
.call.live circle { stroke: var(--ink); }
.call.live .v { fill: var(--ink); }
.call.active circle { fill: var(--amber); stroke: var(--amber); }
.call.active .v { fill: var(--bg); }
.call .r { fill: var(--green); font: 12px 'Geist Mono', monospace; dominant-baseline: central; opacity: 0; transition: opacity .3s; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; stroke-linejoin: round; }
.call.returned .r { opacity: 1; }
.token rect { fill: var(--green); }
.token text { fill: var(--bg); font: 500 12px 'Geist Mono', monospace; text-anchor: middle; dominant-baseline: central; }
.ground-line { stroke: var(--muted); stroke-width: 1; }
.ground { fill: var(--muted); font: 13px 'Geist Mono', monospace; letter-spacing: 0.04em; }

@media (max-width: 960px) {
  body { padding: 28px 16px 32px; gap: 24px; }
  header h1 { font-size: 44px; }
  header p { font-size: 20px; }
  main { grid-template-columns: minmax(0, 1fr); gap: 28px; }
  .stage { order: -1; min-height: 380px; }
  .stage svg { min-height: 340px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <p id="summary"></p>
</header>
<main>
  <div class="side">
    <div class="controls">
      <button id="restart" aria-label="Restart">↺</button>
      <button id="back">‹ Back</button>
      <button id="play" class="play">Play</button>
      <button id="next">Next ›</button>
      <span class="count" id="count"></span>
    </div>
    <input type="range" id="scrub" min="0" value="0" aria-label="Step">
    <p class="say" id="say"></p>
    <div class="code" id="code"></div>
    <section>
      <h2>call stack</h2>
      <ol class="frames" id="frames"></ol>
    </section>
  </div>
  <div class="stage">
    <svg id="tree" preserveAspectRatio="xMidYMax meet" role="img" aria-label="The call tree, growing as the solution runs"></svg>
  </div>
</main>
<script>
const D = /*DATA*/;
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const steps = D.steps;
const calls = D.calls;
const lines = D.code.replace(/\s+$/, '').split('\n');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---- what each call is -------------------------------------------------
const first = [], ret = [], args = [], names = [];
steps.forEach((s, k) => {
  if (s.event === 'call' && first[s.call] === undefined) {
    first[s.call] = k;
    args[s.call] = s.locals;
    const m = (lines[s.line - 1] || '').match(/def\s+(\w+)/);
    names[s.call] = m ? m[1] : D.name;
  }
  if (s.event === 'return') ret[s.call] = k;
});
const kids = calls.map(() => []);
calls.forEach((c, i) => { if (c.parent !== null) kids[c.parent].push(i); });
const leafCount = calls.map(() => 0);
for (let i = calls.length - 1; i >= 0; i--) {
  leafCount[i] = kids[i].length ? kids[i].reduce((a, c) => a + leafCount[c], 0) : 1;
}
const recursive = new Set(calls.map((c, i) => c.parent !== null ? names[i] : null).filter(Boolean));

const short = v => String(v).replace(/^node /, '');
const clip = (t, n) => t.length > n ? t.slice(0, n - 1) + '…' : t;
const argText = i => Object.entries(args[i] || {}).map(([k, v]) => `${k} = ${v}`).join(', ');
const sig = i => `${names[i]}(${argText(i)})`;
const label = i => clip(Object.values(args[i] || {}).map(short).join(', ') || names[i], 5);
const esc = t => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// ---- header ------------------------------------------------------------
$('title').textContent = D.name;
$('summary').textContent = D.summary;
document.title = `${D.name} · LeetCode ${D.number} · canopy`;

// ---- code panel ----------------------------------------------------------
const KEYWORDS = new Set('False None True and as assert async await break class continue def del elif else except finally for from global if import in is lambda nonlocal not or pass raise return try while with yield self'.split(' '));
function paint(text) {
  return text.replace(/(#.*$)|("""|'''|"[^"]*"|'[^']*')|(\b[A-Za-z_]\w*\b)|([&<>])/g, (m, c, s, w, x) => {
    if (c) return `<span class="c">${esc(c)}</span>`;
    if (s) return `<span class="s">${esc(s)}</span>`;
    if (x) return esc(x);
    if (KEYWORDS.has(w)) return `<span class="k">${w}</span>`;
    if (recursive.has(w)) return `<span class="me">${w}</span>`;
    return `<span class="id">${w}</span>`;
  });
}
let inDoc = false;
const codeRows = lines.map((text, i) => {
  const quotes = (text.match(/"""|'''/g) || []).length;
  const doc = inDoc || quotes > 0;
  if (quotes % 2 === 1) inDoc = !inDoc;
  const row = document.createElement('div');
  row.className = 'ln' + (doc ? ' doc' : '');
  row.innerHTML = `<span class="n">${i + 1}</span><span>${doc ? esc(clip(text, 54)) : paint(text)}</span>`;
  $('code').appendChild(row);
  return row;
});

// ---- the call tree -------------------------------------------------------
const svg = $('tree');
const el = (tag, attrs, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  (parent || svg).appendChild(e);
  return e;
};
const maxX = Math.max(...calls.map(c => c.x));
const maxD = Math.max(...calls.map(c => c.depth));
const GX = Math.min(86, 2000 / Math.max(maxX, 1));
const GY = 100;
const R = Math.max(7, Math.min(17, GX * 0.36));
const W = Math.max(720, maxX * GX + 200);
const H = maxD * GY + 230;
const groundY = H - 60;
const x0 = (W - maxX * GX) / 2;
const px = i => x0 + calls[i].x * GX;
const py = i => groundY - 70 - calls[i].depth * GY;
svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

const edges = [], nodes = [];
el('line', { x1: px(0), y1: py(0), x2: px(0), y2: groundY, class: 'edge trunk shown live', 'stroke-width': (2 * Math.sqrt(leafCount[0])).toFixed(1), 'stroke-linecap': 'butt' });
calls.forEach((c, i) => {
  if (c.parent === null) return;
  const x1 = px(c.parent), y1 = py(c.parent), x2 = px(i), y2 = py(i), mid = (y1 + y2) / 2;
  edges[i] = el('path', { d: `M ${x1} ${y1} C ${x1} ${mid}, ${x2} ${mid}, ${x2} ${y2}`, class: 'edge', 'stroke-width': (2 * Math.sqrt(leafCount[i])).toFixed(1) });
});
calls.forEach((c, i) => {
  const g = el('g', { class: 'call', transform: `translate(${px(i)} ${py(i)})` });
  el('circle', { r: R }, g);
  const v = el('text', { class: 'v' }, g);
  v.textContent = label(i);
  if (R < 12) v.style.fontSize = Math.max(7, R * 0.8) + 'px';
  const r = el('text', { class: 'r', x: R + 7 }, g);
  r.textContent = '→ ' + clip(short(c.returned), 8);
  nodes[i] = g;
});
el('line', { x1: 40, y1: groundY, x2: W - 40, y2: groundY, class: 'ground-line' });
el('text', { x: 40, y: groundY + 34, class: 'ground' }).textContent = clip(`LeetCode ${D.number} · ${D.given}`, Math.floor((W - 80) / 9) - 24);
const tail = el('text', { x: W - 40, y: groundY + 34, class: 'ground', 'text-anchor': 'end' });
tail.textContent = `${calls.length} call${calls.length > 1 ? 's' : ''} · answer ${D.answer}`;

const token = el('g', { class: 'token', opacity: 0 });
const tokenBox = el('rect', { rx: 9, height: 20, y: -10 }, token);
const tokenText = el('text', {}, token);

// ---- one step ------------------------------------------------------------
function latestLocals(s, wanted) {
  const found = new Map();
  for (let k = s; k >= 0 && found.size < wanted.size; k--) {
    const c = steps[k].call;
    if (wanted.has(c) && !found.has(c)) found.set(c, k);
  }
  return found;
}
function changed(s) {
  const cur = steps[s];
  for (let k = s - 1; k >= 0; k--) {
    if (steps[k].call === cur.call) {
      return Object.keys(cur.locals).filter(n => cur.locals[n] !== steps[k].locals[n]);
    }
  }
  return [];
}
function narrate(s) {
  const st = steps[s], i = st.call;
  if (st.event === 'call') {
    return calls[i].parent === null ? `<i>${esc(sig(i))}</i> starts` : `calls <i>${esc(sig(i))}</i>`;
  }
  if (st.event === 'return') {
    const p = calls[i].parent;
    const to = p === null ? ' · the answer' : ` to ${esc(names[p])}(${esc(argText(p))})`;
    return `${esc(names[i])}(${esc(argText(i))}) returns <b>${esc(calls[i].returned)}</b>${to}`;
  }
  const fresh = changed(s).filter(n => !(n in (args[i] || {})) || st.locals[n] !== args[i][n]);
  if (fresh.length) return fresh.map(n => `<b>${esc(n)} = ${esc(st.locals[n])}</b>`).join(', ');
  return `line ${st.line}`;
}

let at = 0, timer = null, raf = 0;
function render(s) {
  const st = steps[s];
  const stack = [];
  for (let f = st.call; f !== null && f !== undefined; f = calls[f].parent) stack.push(f);
  const live = new Set(stack);
  calls.forEach((c, i) => {
    const shown = first[i] <= s;
    const back = ret[i] !== undefined && ret[i] <= s;
    nodes[i].classList.toggle('shown', shown);
    nodes[i].classList.toggle('active', i === st.call);
    nodes[i].classList.toggle('live', live.has(i) && i !== st.call);
    nodes[i].classList.toggle('returned', back);
    if (edges[i]) {
      edges[i].classList.toggle('shown', shown);
      edges[i].classList.toggle('live', live.has(i));
    }
  });
  codeRows.forEach((row, i) => row.classList.toggle('on', i === st.line - 1));

  const where = latestLocals(s, live);
  const fresh = new Set(changed(s));
  $('frames').innerHTML = stack.map((f, n) => {
    const loc = steps[where.get(f)].locals;
    const vars = Object.keys(loc).filter(k => !(k in (args[f] || {})) || loc[k] !== args[f][k]);
    const row = vars.map(k => `<span class="var${n === 0 && fresh.has(k) ? ' new' : ''}">${esc(k)} = ${esc(loc[k])}</span>`).join('');
    return `<li class="frame${n === 0 ? ' top' : ''}"><div class="sig">${esc(sig(f))}</div>${row ? `<div class="vars">${row}</div>` : ''}</li>`;
  }).join('');

  $('say').innerHTML = narrate(s);
  $('count').textContent = `${s + 1} / ${steps.length}`;
  $('scrub').value = s;
}

function fly(i) {
  const p = calls[i].parent;
  if (p === null || reduce) return;
  const path = edges[i], L = path.getTotalLength();
  tokenText.textContent = clip(short(calls[i].returned), 8);
  const w = Math.max(22, tokenText.getComputedTextLength() + 14);
  tokenBox.setAttribute('width', w);
  tokenBox.setAttribute('x', -w / 2);
  cancelAnimationFrame(raf);
  const start = performance.now(), dur = 620;
  const tick = now => {
    const t = Math.min(1, (now - start) / dur);
    const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    const pt = path.getPointAtLength(L * (1 - e));
    token.setAttribute('transform', `translate(${pt.x} ${pt.y})`);
    token.setAttribute('opacity', t < 1 ? 1 : 0);
    if (t < 1) raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}

function go(s, animate) {
  s = Math.max(0, Math.min(steps.length - 1, s));
  if (animate && s === at + 1 && steps[at].event === 'return') fly(steps[at].call);
  else { cancelAnimationFrame(raf); token.setAttribute('opacity', 0); }
  at = s;
  render(s);
  if (at === steps.length - 1) stop();
}
function stop() { clearInterval(timer); timer = null; $('play').textContent = 'Play'; }
function play() {
  if (timer) return stop();
  if (at === steps.length - 1) go(0);
  $('play').textContent = 'Pause';
  timer = setInterval(() => go(at + 1, true), 850);
}

$('scrub').max = steps.length - 1;
$('scrub').addEventListener('input', e => { stop(); go(+e.target.value); });
$('next').addEventListener('click', () => { stop(); go(at + 1, true); });
$('back').addEventListener('click', () => { stop(); go(at - 1); });
$('restart').addEventListener('click', () => { stop(); go(0); });
$('play').addEventListener('click', play);
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
  if (e.key === 'ArrowRight') { stop(); go(at + 1, true); }
  else if (e.key === 'ArrowLeft') { stop(); go(at - 1); }
  else if (e.key === ' ') { e.preventDefault(); play(); }
  else if (e.key === 'Home') { stop(); go(0); }
  else if (e.key === 'End') { stop(); go(steps.length - 1); }
});
go(0);
</script>
</body>
</html>
